<style>
:root{
  --bg:#f6f7f9; --surface:#ffffff; --surface2:#f0f2f5; --line:#e2e5ea;
  --text:#14171c; --text2:#5b6472; --text3:#8b95a4;
  --accent:#2f6df6; --ok:#1a8f5a; --warn:#c8871a; --ng:#d2453d;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1116; --surface:#161b22; --surface2:#1c232c; --line:#2a323d;
    --text:#e7ebf0; --text2:#9aa5b4; --text3:#6e7a8a;
    --accent:#5b8cff; --ok:#3fbd81; --warn:#e0a94a; --ng:#f0645c;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1116; --surface:#161b22; --surface2:#1c232c; --line:#2a323d;
  --text:#e7ebf0; --text2:#9aa5b4; --text3:#6e7a8a;
  --accent:#5b8cff; --ok:#3fbd81; --warn:#e0a94a; --ng:#f0645c;
}
*{box-sizing:border-box}
/* 日本語の改行位置を語句の切れ目に寄せる(対応ブラウザのみ) */
p, .note, .callout, .lede, .odd .k, .ledger .lbl, .hyp .claim, .hyp ul, .ai-card .rs,
.result .txt, footer, li{ word-break:auto-phrase; line-break:strict; }

body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  line-height:1.75; -webkit-text-size-adjust:100%;
}
.wrap{max-width:1180px; margin:0 auto; padding:34px 28px 80px}
header{margin-bottom:28px}
.eyebrow{font-size:12px; letter-spacing:.16em; color:var(--text3); text-transform:uppercase}
h1{font-size:27px; margin:8px 0 6px; letter-spacing:.02em}
.lede{font-size:15px; color:var(--text2); margin:0}
.stamp{margin-top:12px; font:13px/1.8 var(--mono); color:var(--text3);
  display:flex; flex-wrap:wrap; gap:4px 14px}
.stamp b{font-weight:600; color:var(--text2)}
section{
  background:var(--surface); border:1px solid var(--line); border-radius:14px;
  padding:26px 28px; margin-bottom:18px;
}
h2{font-size:18px; margin:0 0 16px; display:flex; align-items:baseline; gap:10px}
h2 .num{font:600 13px/1 var(--mono); color:var(--text3); letter-spacing:.1em}
h3{font-size:16px; margin:26px 0 12px; color:var(--text2)}
p{margin:0 0 14px; font-size:15px; color:var(--text2)}
.note{font-size:13.5px; color:var(--text3); line-height:1.8}

/* 候補数字 */
.picks{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; margin:4px 0 18px}
.pick{
  background:var(--surface2); border:1px solid var(--line);
  border-radius:12px; padding:22px 12px; text-align:center;
}
.pick .d{font:700 54px/1 var(--mono); letter-spacing:-.02em}
.pick .tg{margin-top:10px; display:flex; flex-direction:column; gap:4px}
.pick .tg span{
  font-size:12.5px; color:var(--text2); background:var(--bg);
  border:1px solid var(--line); border-radius:99px; padding:2px 6px; white-space:nowrap;
}
.round{font:600 12px/1 var(--mono); color:var(--accent)}

/* 確率 */
.odds{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px}
.odd{background:var(--surface2); border:1px solid var(--line); border-radius:10px; padding:16px 18px}
.odd .v{font:700 27px/1.2 var(--mono)}
.odd .k{font-size:13px; color:var(--text3); margin-top:6px; line-height:1.6}
.odd.miss .v{color:var(--ng)}

/* テーブル */
.scroll{overflow-x:auto; -webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{height:6px}
.scroll::-webkit-scrollbar-thumb{background:var(--line); border-radius:3px}
.hint{display:none}
@media (max-width:560px){ .hint{display:block; font-size:10px; color:var(--text3); margin:0 0 6px} }
table{border-collapse:collapse; width:100%; font-size:14.5px; min-width:460px}
th,td{padding:11px 14px; text-align:right; border-bottom:1px solid var(--line); white-space:nowrap}
th{font-weight:600; color:var(--text3); font-size:13px; text-align:right}
th:first-child,td:first-child{text-align:left}
tbody tr:last-child td{border-bottom:none}
td.mono,th.mono{font-family:var(--mono)}
.ok{color:var(--ok)} .ng{color:var(--ng)} .dim{color:var(--text3)}

/* 分布バー */
.bars{display:flex; flex-direction:column; gap:7px}
.bar{display:grid; grid-template-columns:24px 1fr 130px; gap:12px; align-items:center; font-size:14px}
.bar .t{height:22px; background:var(--surface2); border-radius:5px; overflow:hidden; position:relative}
.bar .f{height:100%; background:var(--accent); opacity:.75}
.bar .e{position:absolute; top:-2px; bottom:-2px; width:2px; background:var(--text3)}
.bars.dev .t{position:relative}
.bars.dev .f{position:absolute; top:0; bottom:0; border-radius:3px; opacity:.9}
.bars.dev .zero{position:absolute; left:50%; top:-3px; bottom:-3px; width:2px;
  background:var(--text3); opacity:.75; transform:translateX(-1px)}
.bar .n .up{color:var(--accent)} .bar .n .down{color:var(--warn)}
.bar .n{font-family:var(--mono); color:var(--text2); text-align:right}
.bar .l{font-family:var(--mono); color:var(--text2)}

/* 透明性 */
dl.kv{margin:0; display:grid; grid-template-columns:auto minmax(0,1fr); gap:9px 20px; font-size:14px}
dl.kv dt{color:var(--text3); white-space:nowrap}
dl.kv dd{margin:0; font-family:var(--mono); color:var(--text);
  word-break:break-all; overflow-wrap:anywhere; min-width:0}

.stale.awaiting{border-color:var(--accent)}
.stale.awaiting strong{color:var(--accent)}
.stale{background:var(--surface); border:1px solid var(--ng); border-left-width:3px;

.stale strong{color:var(--ng)}
.stale .when{font:11px/1.6 var(--mono); color:var(--text3); display:block; margin-top:6px}
.back{display:inline-block; font-size:12px; color:var(--accent); text-decoration:none; margin-bottom:14px}
.back:hover{text-decoration:underline}
.result{display:flex; align-items:center; gap:14px; flex-wrap:wrap; background:var(--surface2);
  border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin:4px 0 14px}
.result .big{font:700 44px/1 var(--mono); letter-spacing:.06em}

.result.hit{border-color:var(--ok)} .result.miss{border-color:var(--ng)}
.result.hit .big{color:var(--ok)} .result.miss .big{color:var(--ng)}
.pending{font-size:13px; color:var(--text3)}
a.rlink{color:var(--accent); text-decoration:none; font-family:var(--mono)}

.ai{display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:14px}
.ai-card{background:var(--surface2); border:1px solid var(--line); border-radius:12px; padding:20px}
.ai-card .who{font-size:15px; font-weight:600; display:flex; justify-content:space-between; align-items:baseline; gap:6px}
.ai-card .who em{font:400 10px/1 var(--mono); color:var(--text3); font-style:normal}
.ai-card .st{font:700 40px/1.2 var(--mono); letter-spacing:.04em; margin:12px 0 4px}
.ai-card .cd{font:14.5px/1.6 var(--mono); color:var(--text2)}
.ai-card .rs{font-size:13.5px; color:var(--text3); margin-top:10px; line-height:1.7}
.ledger{background:var(--surface); border:1px solid var(--line); border-radius:14px;
  padding:18px 22px; margin-bottom:18px; display:grid;
  grid-template-columns:auto repeat(3,auto); gap:10px 28px; align-items:center}
.ledger .big{font:700 30px/1.1 var(--mono)}
.ledger .big.plus{color:var(--ok)} .ledger .big.minus{color:var(--ng)}
.ledger .lbl{font-size:12px; color:var(--text3); margin-top:4px}
.ledger .sub{font:600 17px/1.2 var(--mono); color:var(--text2)}
.ledger .cell{min-width:0}

.money .m{background:var(--surface2); border:1px solid var(--line); border-radius:10px; padding:14px 16px}

.money .m .k{font-size:13px; color:var(--text3); margin-top:6px}
.money .m.plus .v{color:var(--ok)} .money .m.minus .v{color:var(--ng)}
.tickets{display:grid; grid-template-columns:repeat(8,minmax(0,1fr)); gap:6px; margin:10px 0 14px}
.tickets span{font:600 15px/1 var(--mono); text-align:center; padding:9px 0;

.cmt{display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:12px; margin:10px 0 4px}
.cmt .c{background:var(--surface2); border:1px solid var(--line); border-radius:10px; padding:14px 16px}
.cmt .c .who{font-size:13px; font-weight:600; margin-bottom:6px}
.cmt .c .tx{font-size:14px; color:var(--text2); line-height:1.75}
.deb{background:var(--surface2); border:1px solid var(--line); border-radius:12px; padding:18px 20px; margin-bottom:12px}
.deb .topic{font-size:16px; font-weight:600; margin-bottom:4px}
.deb .meta{font:11.5px/1.6 var(--mono); color:var(--text3); margin-bottom:12px}
.deb .say{border-top:1px solid var(--line); padding-top:12px; margin-top:12px}

.callout{
  border-left:4px solid var(--accent); background:var(--surface2);
  padding:16px 20px; border-radius:0 10px 10px 0; font-size:14.5px; color:var(--text2);
  line-height:1.85;
}
.callout strong{color:var(--text)}
footer{margin-top:32px; font-size:13px; color:var(--text3); text-align:center; line-height:1.8}
.err{color:var(--ng); font-size:13px}
.load{color:var(--text3); font-size:13px}

/* --- 位ごとの候補（十の位 / 一の位）と鉄則の検証表 --- */
.posgrid{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin:4px 0 18px}
.posbox{border:1px solid var(--line); border-radius:12px; padding:12px 12px 4px; background:var(--card)}
.posbox > .ttl{font-size:13px; font-weight:700; color:var(--accent); margin:0 0 10px; letter-spacing:.04em}

.rule .rh{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:6px}
.rule .rh h4{margin:0; font-size:18px}
.rule .claim{margin:0 0 10px; color:var(--dim)}
.rule .nums{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; margin:10px 0 4px}
.rule .nums > div{text-align:center; padding:8px 4px; border-radius:8px; background:var(--bg)}
.rule .nums .v{font:700 20px/1.2 var(--mono)}
.rule .nums .k{font-size:11px; color:var(--dim); margin-top:4px}
.tag-ng{display:inline-block; padding:2px 9px; border-radius:999px; font-size:12px; font-weight:700;
        background:rgba(120,120,120,.16); color:var(--dim)}
.tag-ok{display:inline-block; padding:2px 9px; border-radius:999px; font-size:12px; font-weight:700;
        background:rgba(230,120,60,.18); color:var(--warn)}
@media (max-width:560px){
  .posgrid{grid-template-columns:1fr; gap:12px}
  .posbox .pick .d{font-size:40px}
  .rule .nums{grid-template-columns:1fr; gap:6px}
}
/* --- サイトの定義ブロック / 攻略法の検証カード / 用語解説 --- */
.about{border:1px solid var(--line); border-radius:14px; padding:20px 22px; margin:0 0 18px;
       background:var(--card)}
.about h2{margin:0 0 10px; font-size:20px}
.about .big{font-size:17px; line-height:1.9; margin:0 0 14px}
.about ol{margin:0 0 14px; padding-left:1.3em}
.about ol li{margin:6px 0; line-height:1.8}
.about .concl{margin:0; padding:12px 14px; border-radius:10px; background:var(--bg); line-height:1.9}
.rule .rh .src{font-size:12px; color:var(--dim); margin-left:auto}
.rule .plain{margin:10px 0 2px; padding:10px 12px; border-radius:8px; background:var(--bg); line-height:1.9}
.tag-arithmetic,.tag-none,.tag-hindsight{display:inline-block; padding:2px 9px; border-radius:999px;
  font-size:12px; font-weight:700}
.tag-none{background:rgba(120,120,120,.16); color:var(--dim)}
.tag-arithmetic{background:rgba(70,120,200,.16); color:#3d6fb5}
.tag-hindsight{background:rgba(230,120,60,.18); color:var(--warn)}
.zhelp{border:1px dashed var(--line); border-radius:10px; padding:10px 14px; margin:14px 0;
       background:var(--card)}
.zhelp summary{cursor:pointer; font-weight:700; font-size:15px}
.zhelp p,.zhelp ul{line-height:1.9; margin:10px 0}
.zhelp ul{padding-left:1.3em}
.split{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin:14px 0}
.half{border:1px solid var(--line); border-radius:12px; padding:14px; text-align:center;
      background:var(--card)}
.half .hl{font-size:13px; color:var(--dim); font-weight:700}
.half .hv{font:700 38px/1.2 var(--mono); margin:8px 0}
.half .hv.ng{color:var(--warn)}
.half .hk{font-size:12px; color:var(--dim); line-height:1.8}
@media (max-width:560px){
  .about{padding:16px}
  .about .big{font-size:16px}
  .split{grid-template-columns:1fr}
  .rule .rh .src{margin-left:0; width:100%}
}
.srclist{margin:10px 0 14px; padding-left:1.3em; color:var(--dim); font-size:14px}
.srclist li{margin:6px 0; line-height:1.8}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="eyebrow">Numbers3 Selection System</div>
  <h1>ナンバーズ3 ミニ 候補数字</h1>
  <p class="lede">攻略本やネットで「当たる」と言われている手法が、本当に当たるのかを全履歴で検証しています。ミニ（下2桁）の候補も出しますが、当たりやすさは主張しません。収支も隠さず載せます。</p>
  <div class="stamp" id="stamp"></div>
</header>
<main id="app"><p class="load">読み込み中…</p></main>
<footer id="foot"></footer>
</div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct = (v) => v.toFixed(1) + '%';
const jdate = (iso) => {
  if(!iso || iso.length < 16) return iso || '—';
  return `${iso.slice(0,4)}/${iso.slice(5,7)}/${iso.slice(8,10)} ${iso.slice(11,16)}`;
};
function stampLine(parts){ $('#stamp').innerHTML = parts.filter(Boolean).join(''); }

function verdictClass(v){ return v === '有意差なし' ? 'dim' : 'ng'; }

function pickCards(D, list){
  return list.map(d => {
    const tags = (D.tags[d] || []).map(t =>
      `<span title="${esc(t.desc)}${t.hit_rate ? ` / 実測的中率${t.hit_rate}%（基準27.1%）` : ''}">${esc(t.name)}</span>`
    ).join('');
    return `<div class="pick"><div class="d">${esc(d)}</div><div class="tg">${tags}</div></div>`;
  }).join('');
}

// 第7093回から、十の位と一の位で別々の3数字を選んでいる。
// それ以前の回は1組の4数字を両方の位に流用していたので、保存値の形で描き分ける。
function isPos(D){ return !!(D.candidates_ten && D.candidates_one); }

function renderPicks(D){
  if(!isPos(D)) return `<div class="picks">${pickCards(D, D.candidates)}</div>`;
  return `<div class="posgrid">
    <div class="posbox"><div class="ttl">十の位の候補</div>
      <div class="picks">${pickCards(D, D.candidates_ten)}</div></div>
    <div class="posbox"><div class="ttl">一の位の候補</div>
      <div class="picks">${pickCards(D, D.candidates_one)}</div></div>
  </div>`;
}

function outcomeBox(outcome, result, demo){
  if(!result) return '<p class="pending">この回はまだ抽選前です。</p>';
  const cls = outcome && (outcome.mini_hit || outcome.covered) ? 'hit' : 'miss';
  const sim = result.SIMULATED
    ? `<div class="callout" style="margin-bottom:10px;border-left-color:var(--warn)"><strong>これは表示例です。</strong>実際の抽選結果ではありません。${demo ? 'ハズレたときの見え方を確認するための架空のデータです。' : '本物の結果が確定すると自動的に置き換わります。'}</div>`
    : '';
  return sim + `<div class="result ${cls}">
    <div class="big">${esc(result.number)}</div>
    <div class="txt"><strong>${outcome && outcome.mini_hit ? 'ミニ的中' : (outcome && outcome.covered ? `${outcome.covered}桁が一致（ミニは外れ）` : 'ハズレ')}</strong><br>
      ${esc((outcome && outcome.label) || '')}
      ${outcome && outcome.detail ? `<br><span class="note">当選番号の形: ${esc(outcome.detail.pattern)} ／ 3桁の和: ${outcome.detail.sum}</span>` : ''}
    </div></div>`;
}

function renderHypotheses(list, targetRound){
  if(!list.length) return '<p class="note">登録されている仮説はありません。</p>';
  return `<p>バックテストで「当たっているように見える現象」が見つかったとき、<strong>後から都合よく解釈できない形で検証する</strong>ための欄です。条件を先に固定し、登録した回以降の実データだけで判定します。</p>` +
  list.map(h => {
    const r = h.record;
    return `<div class="hyp">
      <h4>${esc(h.title)}</h4>
      <p class="claim">${esc(h.claim)}</p>
      <div class="formula">${esc(h.formula)}</div>
      <div class="odds">
        <div class="odd"><div class="v">${esc(h.prediction)}</div><div class="k">今回の予測（第${targetRound}回）</div></div>
        <div class="odd"><div class="v">${r.hits} / ${r.n}</div><div class="k">的中 / 検証回数（期待 ${r.expected}回）</div></div>
        <div class="odd"><div class="v">${r.p_value === null ? '—' : r.p_value}</div><div class="k">p値（閾値 ${h.threshold_p}）</div></div>
        <div class="odd"><div class="v">${r.progress}%</div><div class="k">${h.min_rounds}回までの進捗</div></div>
      </div>
      <div class="prog"><i style="width:${Math.min(100, r.progress)}%"></i></div>
      <p class="note verdict">現在の判定: ${esc(r.verdict)}</p>
      <h3>なぜ登録したか</h3>
      <p class="note">${esc(h.origin)}</p>
      <h3>事前に固定した条件</h3>
      <ul>${h.conditions.map(c => `<li>${esc(c)}</li>`).join('')}</ul>
      <p class="note">第${h.registered_round}回から登録（${esc(h.registered_at)}）。登録前の的中は数えません。</p>
    </div>`;
  }).join('');
}

function renderRounds(list){
  if(!list.length) return '<p class="note">保存版ページはまだありません。</p>';
  return `<p class="hint">← 横にスクロールできます</p><div class="scroll"><table>
    <thead><tr><th>回</th><th>候補</th><th>当選</th><th>一致</th><th>検証</th></tr></thead>
    <tbody>${list.slice(0,60).map(r => `<tr>
      <td><a class="rlink" href="?round=${r.round}">第${r.round}回</a></td>
      <td class="mono">${r.candidates_ten
        ? r.candidates_ten.join('') + '／' + r.candidates_one.join('')
        : r.candidates.join(',')}</td>
      <td class="mono">${r.result ? esc(r.result) : '<span class="dim">抽選前</span>'}</td>
      <td class="mono ${r.covered ? 'ok' : 'dim'}">${r.result ? r.covered + '桁' : '—'}</td>
      <td style="text-align:left;white-space:normal" class="${r.covered ? 'ok' : 'dim'}">${esc(r.label)}</td>
    </tr>`).join('')}</tbody></table></div>`;
}

function renderSnapshot(S){
  const sel = S.selection, o = S.odds;
  const title = S.demo ? '表示例（架空の回・実際の予想ではありません）' : `第${S.target_round}回の予想`;
  document.title = (S.demo ? '表示例' : `第${S.target_round}回の予想`) + ' — ナンバーズ3 候補数字';
  stampLine([
    S.demo ? '<span><b>見本ページ</b></span>'
           : `<span><b>この回の生成</b> ${esc(jdate(S.generated_at))}</span>`,
    S.result ? `<span><b>結果確定</b> ${esc(S.result.date)}</span>` : '<span>抽選前</span>',
  ]);

  $('#app').innerHTML = `
<a class="back" href="./">← 最新の予想に戻る</a>
<section>
  <h2><span class="num">${S.demo ? '見本' : '保存版'}</span>${esc(title)}</h2>
  <p>${S.demo ? 'ハズレたときの表示を確認するための見本ページです。候補も結果も架空です。'
    : `${esc(S.generated_at)} に生成。第${S.basis.round}回（${esc(S.basis.date)}・当選番号 ${esc(S.basis.number)}）の確定を受けて選出しました。`}</p>
  ${renderPicks(S)}
  <h3>${isPos(S) ? '十の位 × 一の位で作った買い目' : 'この4数字で作った買い目'}（${(S.odds && S.odds.tickets) || 16}通り）</h3>
  ${renderTickets(S)}
  <h3>結果</h3>
  ${outcomeBox(S.outcome, S.result, S.demo)}
  ${renderMoney(S.outcome, S.result)}
  ${renderComments(S.ai_comments)}
  <p class="note">${o && o.mini_none !== undefined
      ? `下2桁の両方が候補に入る確率は ${pct(o.mini_both)}、どちらも入らない確率は ${pct(o.mini_none)} でした。`
      : (o && o.miss_all !== undefined
          ? `この予想が1桁も当たらない確率は ${pct(o.miss_all)} でした。`
          : '')}候補の選び方によらず決まる値です。</p>
</section>

<section>
  <h2><span class="num">02</span>3つのAIの予想</h2>
  ${renderAI(S)}
  ${S.result ? `<p class="note" style="margin-top:12px">当選番号 ${esc(S.result.number)} との照合結果は各カードに表示しています。</p>` : ''}
</section>

<section>
  <h2><span class="num">03</span>この回の選出記録</h2>
  <dl class="kv">
    <dt>方式</dt><dd>${esc(sel.method)}</dd>
    <dt>種の材料</dt><dd>${esc(sel.seed_material)}</dd>
    <dt>SHA-256</dt><dd>${esc(sel.hash)}</dd>
    <dt>傾きの重み</dt><dd>${sel.tilt_weight}</dd>
    ${sel.effective_combos ? `<dt>有効候補数</dt><dd>${sel.effective_combos.toLocaleString()} / ${(sel.combos || 210).toLocaleString()}（重みを考慮した実質的な選択肢の数）</dd>` : ''}
    <dt>選出確率</dt><dd>${(sel.probability * 100).toFixed(4)}% (一様の${sel.ratio_to_uniform}倍)</dd>
    <dt>ロジック版</dt><dd>${esc(S.logic_version)}</dd>
  </dl>
  <p class="note" style="margin-top:12px">同じ種から誰でもこの候補を再計算でき、後から書き換えられないことを確認できます。</p>
</section>`;
  $('#foot').innerHTML = `第${S.target_round}回の保存版 ／ ロジック版 ${esc(S.logic_version)}<br>
    ナンバーズ3の当選番号は予測できません。このサイトは候補の提示と統計の可視化のみを行い、当選を保証しません。`;
}

function renderAI(D){
  const ai = D.ai && D.ai.picks;
  if(!ai) return '<p class="note">AI予想は未取得です。</p>';
  const order = ['gpt','claude','gemini'];
  const rec = D.ai_records || {};
  return '<div class="ai">' + order.map(k => {
    const p = ai[k]; if(!p) return '';
    if(p.status !== 'ok'){
      return `<div class="ai-card off"><div class="who">${esc(p.label)}</div>
        <div class="st">${esc(p.status)}</div>
        <div class="rs">${esc(p.detail || '')}</div></div>`;
    }
    const r = rec[k] || {};
    const oc = p.outcome;
    const recLine = oc
      ? `この回: ${oc.straight_hit ? '本命的中' : `候補${oc.covered}桁が一致`}`
      : (r.n ? `通算 ${r.n}回: 本命的中 ${r.straight}回 ／ 平均カバー ${r.mean_covered}桁（基準1.2）` : '記録はこれから');
    return `<div class="ai-card">
      <div class="who">${esc(p.label)}<em>${esc(p.version || p.model || '')}</em></div>
      ${p.title ? `<div class="rule-title">${esc(p.title)}</div>` : ''}
      <div class="st">${esc(p.mini || (p.straight || '').slice(1) || '—')}</div>
      <div class="cd">3桁なら ${esc(p.straight || '—')} ／ 候補 ${(p.candidates || []).join(',') || '—'}</div>
      <div class="rs">${esc(p.reason || '')}</div>
      ${p.self_assessment ? `<div class="rs self">自己評価: ${esc(p.self_assessment)}</div>` : ''}
      ${p.rule_text ? `<details class="ruledet"><summary>宣言したルールを見る</summary><pre>${esc(p.rule_text)}</pre>
        <div class="hash">ルール文のSHA-256: ${esc(p.rule_hash || '')}</div></details>` : ''}
      <div class="rec">${esc(recLine)}</div>
    </div>`;
  }).join('') + '</div>';
}

function renderAIRecords(D){
  const rec = D.ai_records || {};
  const rows = Object.values(rec).filter(r => r.n > 0);
  if(!rows.length) return '';
  return `<h3>AIごとの通算成績</h3><p class="hint">← 横にスクロールできます</p><div class="scroll"><table>
    <thead><tr><th>AI</th><th>回数</th><th>本命的中</th><th>平均カバー</th><th>1桁以上</th><th>3桁すべて</th></tr></thead>
    <tbody>${rows.map(r => `<tr>
      <td>${esc(r.label)}</td>
      <td class="mono">${r.n}</td>
      <td class="mono ${r.straight ? 'ok' : 'dim'}">${r.straight}回</td>
      <td class="mono">${r.mean_covered}<span class="dim"> / 1.2</span></td>
      <td class="mono">${r.atleast1_rate}%<span class="dim"> / 78.4%</span></td>
      <td class="mono">${r.all3_rate}%<span class="dim"> / 6.4%</span></td>
    </tr>`).join('')}</tbody></table></div>`;
}

function yen(v){ return (v < 0 ? '−' : '') + '¥' + Math.abs(v).toLocaleString(); }

function renderComparison(cmp){
  if(!cmp || !cmp.variants || cmp.variants.length < 2) return '<p class="note">比較データはまだありません。</p>';
  const [a, b] = cmp.variants;
  // 行の定義はデータ側が持つ（選出方式を変えても表示が食い違わないように）
  const rows = cmp.rows || [
    {label:'ミニ的中率', key:'mini_rate', unit:'%', base:'16.0%'},
    {label:'平均カバー桁数', key:'mean_covered', unit:'', base:'1.200'},
    {label:'採用回数のχ²', key:'chi2', unit:'', base:'0'},
    {label:'連続回の数字の重複', key:'overlap', unit:'', base:'1.60'},
    {label:'有効候補数', key:'effective_combos', unit:'', base:'210'},
    {label:'最多採用率', key:'rate_max', unit:'%', base:'40.0%'},
  ];
  const num = v => typeof v === 'number' ? v.toLocaleString() : v;
  const d = cmp.diff;
  return `<p>宝島本の手法に該当する数字を多く含む組をわずかに優遇していますが、それが結果にどう効いているかを、<strong>重みなし（完全な一様抽選）と同じ乱数の種・同じ全履歴で比べました</strong>。対象は第${cmp.span[0]}回〜第${cmp.span[1]}回（${a.n.toLocaleString()}回）。</p>
  <p class="hint">← 横にスクロールできます</p><div class="scroll"><table>
    <thead><tr><th style="text-align:left">指標</th><th>${esc(a.label)}</th><th>${esc(b.label)}</th><th>理論値</th></tr></thead>
    <tbody>${rows.filter(r => a[r.key] !== undefined).map(r => `<tr>
      <td style="text-align:left">${esc(r.label)}</td>
      <td class="mono">${num(a[r.key])}${r.unit}</td>
      <td class="mono">${num(b[r.key])}${r.unit}</td>
      <td class="mono dim">${esc(r.base)}</td></tr>`).join('')}
    </tbody>
  </table></div>
  ${d ? `<div class="callout" style="margin-top:14px">
    <strong>重み付けは、当たりやすさを改善していません。</strong><br>
    的中率は ${a.mini_rate}%（重みあり）と ${b.mini_rate}%（一様）。差は <strong>${d.mini_rate > 0 ? '+' : ''}${d.mini_rate}ポイント</strong>です。<br><br>
    <strong>体重計にたとえます。</strong>2人の体重が0.9kg違っていたとして、使っている体重計が${d.se}kg単位でしか測れないなら、「どちらが重い」とは言い切れません。
    この比較も同じで、測り方そのものが ${d.se}ポイントくらい平気でブレます。
    差の ${Math.abs(d.mini_rate)}ポイントは、<strong>そのブレ ${Math.abs(d.z)}個分</strong>にあたります（これがz値です）。
    ブレ2個分を超えなければ差とは認めない決まりなので、判定は<strong>${esc(d.verdict)}</strong>です。
    ${d.mini_rate < 0 ? '<br><br>なお数字の上では<strong>一様のほうが高く出ています</strong>。これも誤差の範囲なので「一様のほうが当たる」とは言えませんが、少なくとも<strong>重み付けが役に立っている証拠はどこにもありません</strong>。この傾向が続くようなら、重み付けはやめて完全な一様抽選にします。' : ''}
  </div>
  ${zHelp(false)}` : ''}
  <p class="note">変わるのは有効候補数です。${num(a.effective_combos)}（一様なら${num(cmp.uniform_space || 210)}）。つまり原典への配慮は、選択肢を約${(100 - a.effective_combos / (cmp.uniform_space || 210) * 100).toFixed(0)}%狭める代わりに、読み物としての理由を与えているだけ、ということです。${esc(cmp.note || '')}</p>`;
}

function renderComments(c){
  if(!c || !Object.keys(c).length) return '';
  return `<h3>3つのAIの所見</h3>
  <p class="note">結果が出たあと、3つのAIが自動で書いたものです。人間は指示していません。</p>
  <div class="cmt">` + ['gpt','claude','gemini'].filter(k => c[k]).map(k =>
    `<div class="c"><div class="who">${esc(c[k].label)}</div><div class="tx">${esc(c[k].text)}</div></div>`
  ).join('') + '</div>';
}

function renderDebate(d, list){
  if(!d) return '<p class="note">まだ討論は行われていません。</p>';
  return `<p>3つのAIが週1回、人間の指示なしで設計について議論します。<strong>ここで出た提案がサイトに自動で反映されることはありません</strong>。採用するかどうかは人間が決めます。</p>
  <div class="deb">
    <div class="topic">第${d.no}回「${esc(d.topic)}」</div>
    <div class="meta">${esc(String(d.at).replace('T',' ').slice(0,16))}</div>
    ${d.transcript.map(t => `<div class="say"><div class="who">${esc(t.label)}</div><div class="tx">${esc(t.text)}</div></div>`).join('')}
    ${d.next_topic ? `<div class="next">次回の論点: ${esc(d.next_topic)}</div>` : ''}
  </div>` + (list && list.length > 1 ? `<h3>これまでの議題</h3><ul class="hyp-list">${
    list.slice(1, 8).map(x => `<li>第${x.no}回 ${esc(x.topic)}（${esc(String(x.at).slice(0,10))}）</li>`).join('')
  }</ul>` : '');
}

function renderMoney(outcome, result){
  if(!outcome || !result || outcome.cost === undefined) return '';
  const prize = outcome.prize || 0, profit = outcome.profit || 0;
  return `<h3>この回の収支</h3>
  <div class="money">
    <div class="m"><div class="v">${yen(outcome.cost)}</div><div class="k">購入金額（${outcome.tickets}通り × 200円）</div></div>
    <div class="m ${prize ? 'plus' : ''}"><div class="v">${yen(prize)}</div><div class="k">${prize ? 'ミニの当選金額（1口あたり）' : '当選金額（的中なし）'}</div></div>
    <div class="m ${profit >= 0 ? 'plus' : 'minus'}"><div class="v">${profit >= 0 ? '+' : ''}${yen(profit)}</div><div class="k">収支</div></div>
  </div>
  <p class="note">${prize
    ? `下2桁「${esc(outcome.last2)}」が買い目${outcome.tickets}通りの中にあったため的中。1口200円で買っているので、当選金額 ${yen(prize)} から購入金額 ${yen(outcome.cost)} を引いて <strong>${profit >= 0 ? '+' : ''}${yen(profit)}</strong> です。`
    : `下2桁「${esc(outcome.last2)}」は買い目${outcome.tickets}通りに無かったため、購入金額 ${yen(outcome.cost)} がそのまま損失になります。`}</p>`;
}

function renderTickets(D){
  const ten = isPos(D) ? [...D.candidates_ten].sort() : [...D.candidates].sort();
  const one = isPos(D) ? [...D.candidates_one].sort() : ten;
  return '<div class="tickets">' + ten.map(a => one.map(b =>
    `<span>${esc(a)}${esc(b)}</span>`).join('')).join('') + '</div>';
}

function renderTagPoints(pts, chosen){
  if(!pts) return '';
  return '<div class="bars">' + Object.keys(pts).map(d => {
    const max = Math.max(4, ...Object.values(pts));
    const p = pts[d], w = (p / max * 100).toFixed(0);
    const on = chosen.includes(d);
    return `<div class="bar" style="grid-template-columns:18px 1fr 84px">
      <div class="l" style="${on ? 'color:var(--accent);font-weight:700' : ''}">${d}</div>
      <div class="t"><div class="f" style="width:${w}%;${on ? '' : 'opacity:.35'}"></div></div>
      <div class="n">${p}点${on ? ' <span style="color:var(--accent)">選出</span>' : ''}</div>
    </div>`;
  }).join('') + '</div>';
}

function renderDist(counts, expected){
  const keys = Object.keys(counts);
  const maxAbs = Math.max(...keys.map(d => Math.abs(counts[d] - expected)), 1);
  return `<div class="bars dev">` + keys.map(d => {
    const c = counts[d], diff = c - expected;
    const pct = Math.abs(diff) / maxAbs * 50;
    const style = diff >= 0
      ? `left:50%; width:${pct}%; background:var(--accent)`
      : `left:${50 - pct}%; width:${pct}%; background:var(--warn)`;
    return `<div class="bar">
      <div class="l">${d}</div>
      <div class="t"><div class="zero"></div><div class="f" style="${style}"></div></div>
      <div class="n">${c.toLocaleString()} <span class="${diff >= 0 ? 'up' : 'down'}">${diff >= 0 ? '+' : ''}${Math.round(diff)}</span></div>
    </div>`;
  }).join('') + `</div>
  <p class="note">中央の線が期待値 ${Math.round(expected).toLocaleString()}回。右に伸びるほど多く出ていて、左に伸びるほど出ていない数字です。最大でも${Math.round(maxAbs)}回の差しかなく、統計的には誤差の範囲です。</p>`;
}

// 統計の用語は、たとえ話を添えないと伝わらない。各所で使い回す
function zHelp(open){
  return `<details class="zhelp"${open ? ' open' : ''}>
    <summary>「z値」ってなに？（クリックで開きます）</summary>
    <p><strong>コインを100回投げて、表が55回出たとします。</strong>このコイン、表が出やすいと言えるでしょうか。
    言えません。ふつうのコインでも55回くらいは当たり前に起きるからです。では60回なら？ 70回なら？
    ——この「どこからが当たり前でないか」を測る物差しが <strong>z値</strong>です。</p>
    <p>z値は<strong>「いつものブレ何個分、ズレているか」</strong>を表します。</p>
    <ul>
      <li><strong>0に近い</strong> … まったくふつう。何も起きていない</li>
      <li><strong>±1くらい</strong> … よくあるブレの範囲</li>
      <li><strong>±2を超える</strong> … ふつうのブレでは説明しにくい。ここで初めて「何かあるかも」と考える</li>
    </ul>
    <p>このサイトでは<strong>±1.96（およそ±2）</strong>を境目にしています。
    これを超えなければ「<strong>効果なし</strong>」、つまり何も考えずに数字を選んだ場合と区別がつかない、という意味です。</p>
  </details>`;
}

// ネットの攻略サイトが主張している手法の検証
function renderClaims(c){
  if(!c || !c.items) return '';
  const KIND = {
    arithmetic: ['算数で決まる', '主張自体は正しいが、計算すれば必ずそうなる数字。予想には使えない'],
    none:       ['効果なし',   '何も考えずに数字を選んだ場合と区別がつかない'],
    hindsight:  ['後知恵',     '過去のデータから「多かったもの」を選んだので、そのデータの中でだけ当たって見える'],
  };
  const z = v => (v > 0 ? '+' : v < 0 ? '−' : '±') + Math.abs(v).toFixed(2);
  const cards = c.items.map(i => {
    const [label, desc] = KIND[i.kind] || ['—', ''];
    return `<div class="rule">
      <div class="rh"><h4>${esc(i.name)}</h4>
        <span class="tag-${i.kind}">${esc(label)}</span>
        <span class="src">出典: ${esc(i.source)}</span></div>
      <p class="claim">サイトの主張: 「${esc(i.claim)}」</p>
      <div class="nums">
        <div><div class="v">${i.rate.toFixed(2)}%</div><div class="k">実際にそうだった割合</div></div>
        <div><div class="v dim">${i.base.toFixed(2)}%</div><div class="k">何も考えない場合（基準）</div></div>
        <div><div class="v ${Math.abs(i.z) < 1.96 ? '' : 'ng'}">${z(i.z)}</div><div class="k">z値（${esc(i.verdict)}）</div></div>
      </div>
      <p class="plain"><strong>かみくだくと:</strong> ${esc(i.plain)}</p>
      <p class="note">検証方法: ${esc(i.how)}（${i.n.toLocaleString()}回で検定）／ ${esc(desc)}</p>
    </div>`;
  }).join('');

  const g = c.gold;
  const gold = g ? `
  <h3>「黄金数字」で起きていること — 後知恵の見本</h3>
  <p>「過去によく出た下2桁10個（${g.numbers.join('・')}）を狙え」という手法があります。これを<strong>2つの期間に分けて</strong>調べると、何が起きているかがはっきりします。</p>
  <div class="split">
    <div class="half"><div class="hl">第1〜${g.source_rounds}回</div>
      <div class="hv ng">${g.in_sample.rate}%</div>
      <div class="hk">この10個を選ぶのに使った期間<br>z=${z(g.in_sample.z)} → <strong>${esc(g.in_sample.verdict)}</strong></div></div>
    <div class="half"><div class="hl">第${g.source_rounds + 1}回以降</div>
      <div class="hv">${g.out_sample.rate}%</div>
      <div class="hk">選んだ<strong>あと</strong>の期間（${g.out_sample.n.toLocaleString()}回）<br>z=${z(g.out_sample.z)} → <strong>${esc(g.out_sample.verdict)}</strong></div></div>
  </div>
  <div class="callout">
    <strong>クラスで一番背の高い人を選んでから「この人は背が高い」と言っているのと同じです。</strong>
    選んだ本人について言えば必ず正しいのですが、その人が<strong>来年も伸び続ける</strong>わけではありません。<br><br>
    黄金数字も同じで、選ぶのに使った期間では ${g.in_sample.rate}%（基準10%）と確かに多いのに、
    <strong>選んだ後の期間では ${g.out_sample.rate}% と、ぴたりと基準に戻ります。</strong>
    この10個に何の力もなかったことが、これではっきり分かります。
  </div>` : '';

  const cold = (c.cold && c.cold.length) ? `
  <h3>「長く出ていない数字」はどうなのか</h3>
  <p>この点については、攻略サイトの主張が<strong>真っ二つに割れています</strong>。「長く出ていない数字は出にくいから避けろ」と書くサイトと、「そろそろ出るから狙え」と書くサイトが両方あります。実際に数えました。</p>
  <p class="hint">← 横にスクロールできます</p><div class="scroll"><table>
    <thead><tr><th>何回出ていないか</th>${c.cold.map(r => `<th>${r.gap}${r.gap >= 15 ? '回〜' : '回'}</th>`).join('')}</tr></thead>
    <tbody><tr><td style="text-align:left">次回に出た割合</td>${c.cold.map(r => `<td class="mono">${r.rate}%</td>`).join('')}</tr></tbody>
  </table></div>
  <p class="note">どの列も基準の27.10%の周りに並ぶだけで、<strong>ご無沙汰の長さと次回の出やすさには関係がありません</strong>。避けても狙っても同じです。両方の主張が同時に流通していること自体が、どちらにも根拠がないことを示しています。</p>` : '';

  const wd = (c.weekday && c.weekday.length) ? `
  <h3>曜日によって変わるのか</h3>
  <p>「金曜は62.7%で引っ張る」という主張があったので、曜日ごとに分けて調べました。</p>
  <p class="hint">← 横にスクロールできます</p><div class="scroll"><table>
    <thead><tr><th>曜日</th><th>実測</th><th>基準</th><th class="mono">z値</th><th>判定</th><th>回数</th></tr></thead>
    <tbody>${c.weekday.map(r => `<tr><td>${esc(r.name)}</td><td class="mono">${r.rate.toFixed(2)}%</td>
      <td class="mono dim">${r.base.toFixed(2)}%</td><td class="mono">${z(r.z)}</td>
      <td class="${verdictClass(r.verdict)}">${esc(r.verdict)}</td>
      <td class="mono dim">${r.n.toLocaleString()}</td></tr>`).join('')}</tbody></table></div>
  <p class="note"><strong>5つの曜日を調べれば、そのうち1つくらいは偶然±2を超えます。</strong>「5%の確率で起きること」を5回試せば、1回は起きるからです。これは「くじを5枚引いて1枚当たった」のと同じで、曜日に意味があることの証拠にはなりません。本当に調べたいなら、<strong>先に曜日を1つ決めてから</strong>検証する必要があります。</p>` : '';

  return cards + gold + cold + wd;
}

// 原典の鉄則を項目ごとに検証する。全履歴(3桁)とミニ(下2桁)の両方を並べる
function renderMiniRules(m, rules){
  if(!m) return '';
  const byName = {};
  (rules || []).forEach(r => { byName[r.name] = r; });
  const badge = v => v === '有意差なし'
    ? '<span class="tag-ng">効果なし</span>' : '<span class="tag-ok">要確認</span>';
  const z = v => (v > 0 ? '+' : v < 0 ? '−' : '±') + Math.abs(v).toFixed(2);
  const pc = v => v.toFixed(2) + '%';

  const cards = m.rules.map(r => {
    const all = byName[r.name];
    return `<div class="rule">
      <div class="rh"><h4>${esc(r.name)}</h4>${badge(r.both.verdict)}</div>
      <p class="claim">原典の主張: ${esc(r.claim)}</p>
      <dl class="kv">
        <dt>検証方法</dt><dd>${esc(r.how)}を「次回に出る数字」とみなし、実際に出たかを数える</dd>
        ${all ? `<dt>全履歴（3桁すべて）</dt><dd class="mono">${pc(all.rate)}（基準 ${pc(all.base)}）z=${z(all.z)} → ${esc(all.verdict)}</dd>` : ''}
      </dl>
      <div class="nums">
        <div><div class="v">${pc(r.per_digit.rate)}</div><div class="k">ミニの各位が入っていた割合<br>（基準 ${pc(r.per_digit.base)}）</div></div>
        <div><div class="v">${pc(r.both.rate)}</div><div class="k">下2桁の<strong>両方</strong>が入っていた割合<br>（基準 ${pc(r.both.base)}）</div></div>
        <div><div class="v ${Math.abs(r.both.z) < 1.96 ? '' : 'ng'}">${z(r.both.z)}</div><div class="k">z値<br>（±1.96を超えたら偏り）</div></div>
      </div>
    </div>`;
  }).join('');

  const posRows = m.pos_pull.map(r => `<tr>
      <td>${esc(r.name)}</td><td class="mono">${pc(r.rate)}</td>
      <td class="mono dim">${pc(r.base)}</td><td class="mono">${z(r.z)}</td>
      <td class="${verdictClass(r.verdict)}">${esc(r.verdict)}</td>
      <td class="mono dim">${r.n.toLocaleString()}</td>
    </tr>`).join('');

  return cards + `
  <h3>桁別ひっぱり（同じ位に同じ数字が続くか）</h3>
  <p>原典の鉄則の中で、これだけが<strong>「位」を指定した主張</strong>です。ミニは十の位と一の位の2つで決まるので、本来いちばん効いてほしい項目です。</p>
  <p class="hint">← 横にスクロールできます</p><div class="scroll"><table>
    <thead><tr><th>項目</th><th>実測</th><th>基準</th><th class="mono">z値</th><th>判定</th><th>検定数</th></tr></thead>
    <tbody>${posRows}
      <tr><td>ゾロ目（11・22など）</td><td class="mono">${pc(m.zoro.rate)}</td>
        <td class="mono dim">${pc(m.zoro.base)}</td><td class="mono">${z(m.zoro.z)}</td>
        <td class="${verdictClass(m.zoro.verdict)}">${esc(m.zoro.verdict)}</td>
        <td class="mono dim">${(m.n + 1).toLocaleString()}</td></tr>
    </tbody></table></div>`;
}

                       : 'この候補は最新ではありません。'}</strong><br>
    ${awaiting
      ? '結果が反映され次第、次の回の候補を自動で生成します。下の候補は第' + D.target_round + '回向けに出したものです。'

  const cl = s.claims;
  const about = `<section class="about">
  <h2>このサイトは何をしているか</h2>
  <p class="big">攻略本やネットの攻略サイトで「当たる」と言われている手法が、<strong>本当に当たるのかを実データで検証するサイト</strong>です。ナンバーズ3の全履歴${s.draws.toLocaleString()}回（${esc(s.span[0])}〜${esc(s.span[1])}）を使い、手法を1つずつ数えています。</p>
  <ol>
    <li><strong>言われている手法を検証する</strong> — 攻略本『別冊宝島271』の鉄則と、ネットの攻略サイトが主張している手法を、項目ごとに検定します（02・03）</li>
    <li><strong>候補数字も出す</strong> — ミニ（下2桁）の候補を、誰でも再現できる抽選で選びます。<strong>当たりやすいとは主張しません</strong>（01）</li>
    <li><strong>自分の収支を隠さない</strong> — 毎回いくら買っていくら戻ったか、通算でいくら負けているかを、いちばん上に出します</li>
  </ol>
  <p class="concl">${cl ? `<strong>いまのところの結論。</strong>攻略本の鉄則${s.mini_rules ? s.mini_rules.total : 0}項目と、ネットで見つけた手法${cl.items.length}項目を調べて、<strong>何も考えずに数字を選ぶより当たりやすかった手法は1つもありませんでした。</strong>当たるように見える主張は、（1）計算すれば必ずそうなる数字か、（2）過去のデータから都合よく選んだものか、のどちらかでした。`

</section>`;

  $('#app').innerHTML = stale + about + ledger + `
<section>
  <h2><span class="num">01</span>第${D.target_round}回の候補</h2>
  <p>第${D.basis.round}回（${esc(D.basis.date)}・当選番号 ${esc(D.basis.number)}）の確定を受けて選出しました。</p>

    <div class="odd"><div class="v">${pct(o.mini_either)}</div><div class="k">どちらか片方が入る確率</div></div>
    <div class="odd miss"><div class="v">${pct(o.mini_none)}</div><div class="k">どちらも入らない確率</div></div>
    <div class="odd"><div class="v">${o.tickets}口</div><div class="k">全部買うと ${o.cost.toLocaleString()}円</div></div>
  </div>
  <h3>${isPos(D) ? '十の位 × 一の位で作る買い目' : 'この4数字で作る買い目'}（${o.tickets}通り）</h3>
  ${renderTickets(D)}
  ${o.mini_prize && o.mini_prize.mean ? `<p class="note">ミニ1口（200円）の的中確率は1.0%、当選金額の平均は ${o.mini_prize.mean.toLocaleString()}円（直近${o.mini_prize.n}回の実測／中央値 ${o.mini_prize.median.toLocaleString()}円）。<strong>1口あたりの期待値は約${o.mini_prize.expected_value}円</strong>で、200円を払って平均86円が戻る計算です。</p>` : ''}
  <p class="note">これらは候補を選んだ時点で決まる数学的な確率で、選び方によって変わりません。どんな選出方法でも同じ値になります。<strong>口数を増やしても減らしても、期待回収率は約43%で一定</strong>です（1口が押さえるのは100通りのうち1通りだけなので、口数に比例して購入額も当選確率も増えるため）。</p>
</section>

<section>
  <h2><span class="num">02</span>検証①：攻略本『別冊宝島271』の鉄則</h2>
  <p>このサイトの出発点は『別冊宝島271 宝くじ＆ナンバーズ大当り鉄則読本』です。そこに書かれた手法を、<strong>項目ごとに全履歴${s.draws.toLocaleString()}回で検定しました</strong>。ミニ（下2桁）に当てはめた場合の数字も併記しています。</p>

<section>
  <h2><span class="num">03</span>検証②：ネットの攻略サイトが言う手法</h2>
  <p>「ナンバーズ3 攻略法」で検索して出てくるサイトを実際に読み、そこで紹介されている手法を集めました（2026年10月調査）。<strong>サイトが書いている主張の数値をそのまま載せ、同じものを全履歴で数え直しています。</strong></p>
  <div class="callout">
    <strong>${cl ? `${cl.items.length}項目を調べて、何も考えない場合より当たりやすかった手法は ${cl.useful}個でした。` : ''}</strong><br>
    「当たる」と言われている主張は、大きく2種類に分かれました。
    <strong>①算数で決まる数字</strong>（主張は正しいが、計算すれば必ずそうなるので予想に使えない。${cl ? cl.arithmetic : 0}項目）と、
    <strong>②後知恵</strong>（過去のデータから「多かったもの」を選んだので、そのデータの中でだけ当たって見える）です。
  </div>
  ${zHelp(false)}
  ${renderClaims(cl)}
  <h3>調べたサイト</h3>
  <p class="note">2026年10月時点で「ナンバーズ3 攻略法」「ナンバーズ3 法則」などで上位に出てくるサイトを読み、紹介されている手法を集めました。<strong>特定のサイトを批判する目的ではありません。</strong>同じ手法が複数のサイトで繰り返し紹介されているため、数値が具体的に書かれている記述を代表として引用しています。</p>
  <ul class="srclist">
    <li>umasaku「ナンバーズ3の数字の選び方と5つのポイント」— 引っ張り・前数字・後数字・裏数字の各確率</li>
    <li>aetheria「ナンバーズ3の法則性をデータで証明！」— 合計値・偶奇・大小・ダブル・トリプル</li>
    <li>適中攻略ナビ「2つの勝利の法則」— 偶奇の組み合わせ・低数字高数字の組み合わせ</li>
    <li>宝くじ検証「ナンバーズ3の攻略法を6つ厳選」「ナンバーズ3の法則性とは？」— 黄金数字・足し算理論・連番・前回番号の回避</li>
    <li>ユメドリのネタ帳「ナンバーズは6つの法則から」— 未出現数字・連続数字・裏数字</li>
  </ul>
  <p class="note">なお、これらのサイトが挙げる手法の多くは、このサイトの土台である『別冊宝島271』（1996年）と同じものです。<strong>30年間、同じ手法が形を変えて紹介され続けていますが、その間に積み上がった7,000回分のデータで確かめた記録は見当たりませんでした。</strong>それがこのサイトを作っている理由です。</p>
</section>

<section>
  <h2><span class="num">04</span>3つのAIの予想</h2>
  <p>3つのAIは、その場で数字を考えていません。<strong>抽選前にそれぞれが「選定ルール」を宣言し、そのルールが機械的に数字を決めています</strong>。大きく出ているのが<strong>ミニの本命（下2桁）</strong>です。同じ過去データから誰が計算しても同じ数字になり、後から理由を付け替えることはできません。</p>
  ${renderAI(D)}
  <div class="callout" style="margin-top:14px">
    <strong>この3つも当たりません。</strong>ミニの本命2桁が当たる確率はどの予想でも1/100＝1.0%、このサイトの買い目${o.tickets}通りが当たる確率は${pct(o.mini_both)}です。ルールを宣言しても的中率は変わりません。変わるのは<strong>「理由が後付けか、先にあったか」</strong>です。以前は数字を出してから理由を書いていましたが、今は宣言したルールが数字を決めています。ルール文を書き換えた場合は変更履歴に残ります。
  </div>
  ${renderAIRecords(D)}
</section>

<section>
  <h2><span class="num">05</span>どう選んでいるか</h2>
  ${isPos(D) ? `
  <p>ミニは<strong>十の位と一の位の2桁</strong>で決まります。そこで<strong>位ごとに別々の3数字</strong>を選んでいます。0〜9から3つを選ぶ組み合わせは120通り（10C3）なので、十の位と一の位の組み合わせは <strong>120 × 120 = 14,400通り</strong>です。</p>
  <p>完全な等確率ではなく、<strong>宝島本の手法（ひっぱり・スライド・裏数字・合わせ数字）に該当する数字を多く含む組を、わずかに選ばれやすく</strong>しています。位ごとの採点では、原典で唯一「位」を指定している<strong>桁別ひっぱり</strong>（前回と同じ位に同じ数字が出るという主張）を1点として加えています。選ばれた組は一様の場合の <strong>${sel.ratio_to_uniform}倍</strong>でした。</p>
  <div class="callout" style="border-left-color:var(--warn)">
    <strong>第7093回から、この方式に変えました。</strong>それ以前は4数字を1組だけ選び、十の位にも一の位にも同じ4数字を使っていました（買い目16通り・3,200円）。ミニは2桁あり、原典の鉄則の中心も桁ごとの主張なのに、桁を区別していなかったためです。<br><br>
    買い目は <strong>3×3=9通り（1,800円）</strong>になります。的中率は16%から9%に下がりますが、<strong>期待回収率は約43%のまま変わりません</strong>。1口が押さえるのは100通りのうち1通りだけなので、口数を増減しても率は動きません。<br><br>
    <strong>すでに公開した回の候補と判定方式は変更していません。</strong>第7092回までは当時の方式のまま保存版ページに残っています。
  </div>` : `
  <p>0〜9から4つを選ぶ組み合わせは <strong>210通り</strong>（10C4）です。この210通りから抽選で1組を選びます。</p>
  <p>完全な等確率ではなく、<strong>宝島本の手法（ひっぱり・スライド・裏数字・合わせ数字）に該当する数字を多く含む組を、わずかに選ばれやすく</strong>しています。今回の範囲は ${sel.spread.min}〜${sel.spread.max}倍で、選ばれた組は一様の場合の <strong>${sel.ratio_to_uniform}倍</strong>（確率 ${(sel.probability * 100).toFixed(3)}%、一様なら${(sel.probability_uniform * 100).toFixed(3)}%）でした。</p>`}
  <div class="callout">
    この傾きは<strong>前回の当選番号との関係</strong>で決まるため、特定の数字が固定的に有利になることはありません。全履歴3000回で検証したところ、傾きを入れても数字ごとの採用率の偏り（χ²=4.8）は一様ランダム（χ²=4.0）とほぼ変わらず、いずれも5%限界16.92を大きく下回りました。<br><br>
    乱数の種は「<strong>回号 + 直近の当選番号</strong>」のSHA-256です。前回の結果が確定するまで次回の候補は計算できず、確定後は誰でも同じ値を再現できます。日時や実行環境には依存しません。
  </div>
  <h3>今回の原典ポイント（前回 ${esc(D.basis.number)} から見た各数字）</h3>
  ${isPos(D) && sel.pos ? `
    <p class="note">位ごとに採点が違います。十の位では前回の十の位の数字に、一の位では前回の一の位の数字に、桁別ひっぱりの1点が加わります。</p>
    <h4 style="margin:14px 0 6px">十の位</h4>
    ${renderTagPoints(sel.pos.ten.tag_points, D.candidates_ten)}
    <h4 style="margin:14px 0 6px">一の位</h4>
    ${renderTagPoints(sel.pos.one.tag_points, D.candidates_one)}`
  : renderTagPoints(sel.tag_points, D.candidates)}
  <h3>この回の選出記録</h3>
  <dl class="kv">
    <dt>方式</dt><dd>${esc(sel.method)}</dd>
    <dt>種の材料</dt><dd>${esc(sel.seed_material)}</dd>
    <dt>SHA-256</dt><dd>${esc(sel.hash)}</dd>
    <dt>傾きの重み</dt><dd>${sel.tilt_weight}</dd>
    ${sel.effective_combos ? `<dt>有効候補数</dt><dd>${sel.effective_combos.toLocaleString()} / ${(sel.combos || 210).toLocaleString()}（重みを考慮した実質的な選択肢の数）</dd>` : ''}
    <dt>選出確率</dt><dd>${(sel.probability * 100).toFixed(4)}% (一様の${sel.ratio_to_uniform}倍)</dd>
    <dt>ロジック版</dt><dd>${esc(D.logic_version)}</dd>
    <dt>生成時刻</dt><dd>${esc(D.generated_at)}</dd>
  </dl>
</section>

<section>
  <h2><span class="num">06</span>この選び方は一様ランダムと何が違うのか</h2>
  ${renderComparison(D.comparison)}
  <h3>再現検証用のデータ</h3>
  <p>各回の候補・乱数の種・ハッシュ・原典ポイント・結果・収支を1つの表にまとめています。表計算ソフトで開いて、ご自身で再計算できます。</p>
  <p><a class="rlink" href="data/record.csv" download>record.csv をダウンロード</a></p>
</section>

<section>
  <h2><span class="num">07</span>抽選の偏りの監視</h2>
  <p>抽選機に偏りが出ていないかを毎回検定しています。χ²が5%限界の${s.chi2_limit_5}を超えたら偏りの疑いが出ます。</p>
  <div class="odds">
    <div class="odd"><div class="v ${s.chi2_all < s.chi2_limit_5 ? 'ok' : 'ng'}">${s.chi2_all}</div><div class="k">全体のχ²（限界${s.chi2_limit_5}）</div></div>
    ${s.chi2_pos.map((c, i) => `<div class="odd"><div class="v ${c < s.chi2_limit_5 ? 'ok' : 'ng'}">${c}</div><div class="k">${['百','十','一'][i]}の位のχ²</div></div>`).join('')}
  </div>
  <h3>下2桁（ミニの対象）の分布</h3>
  <p>00〜99の100通りについて、出現回数が均等かを検定しています。</p>
  <div class="odds">
    <div class="odd"><div class="v ${s.mini.chi2_last2 < s.mini.chi2_last2_limit ? 'ok' : 'ng'}">${s.mini.chi2_last2}</div><div class="k">下2桁100通りのχ²（5%限界 ${s.mini.chi2_last2_limit}）</div></div>
    <div class="odd"><div class="v">${s.mini.expected}回</div><div class="k">1通りあたりの期待出現回数</div></div>
    <div class="odd"><div class="v">${s.mini.top.map(x => x.n).join(' ')}</div><div class="k">最も多い下2桁（${s.mini.top.map(x => x.c).join('/')}回）</div></div>
    <div class="odd"><div class="v">${s.mini.bottom.map(x => x.n).join(' ')}</div><div class="k">最も少ない下2桁（${s.mini.bottom.map(x => x.c).join('/')}回）</div></div>
  </div>
  <p class="note">χ²が5%限界を下回っているので、<strong>特定の下2桁が出やすいという事実はありません</strong>。最多と最少の差も、100通りに分けたときの自然なばらつきの範囲です。</p>

  <h3>数字ごとの出現回数（期待値からのズレ）</h3>
  <div class="bars">${renderDist(s.digit_counts, s.digit_expected)}</div>
  <h3>湿度の影響</h3>
  <p>高湿度期（6〜9月・${s.season.humid_draws.toLocaleString()}回）と低湿度期（12〜3月・${s.season.dry_draws.toLocaleString()}回）で出現分布を比較しました。同質性のχ²は <strong>${s.season.homogeneity_chi2}</strong> で、5%限界${s.chi2_limit_5}を下回ります。<strong>季節による差は検出されません</strong>。</p>
  <p class="note">ダブル出現率 ${s.double_rate}%（理論27%） / トリプル ${s.triple_rate}%（理論1%） / 3桁の和の平均 ${s.sum_mean}（理論13.5）</p>
</section>

<section>
  <h2><span class="num">08</span>AI同士の自動討論</h2>
  ${renderDebate(D.debate_latest, D.debates)}
</section>

<section>
  <h2><span class="num">09</span>登録した仮説</h2>
  ${renderHypotheses(D.hypotheses || [], D.target_round)}
</section>

<section>
  <h2><span class="num">10</span>保存版ページ</h2>
  <p>各回の予想ページをそのまま保存しています。候補・乱数の種・AIの予想・結果の検証が、当時の形で残ります。</p>
  ${D.record && D.record.start_round ? `<p class="note">記録は<strong>第${D.record.start_round}回から</strong>。現在 ${D.record.count}回分を保存し、うち${D.record.judged}回が結果確定済みです。</p>` : ''}
  ${D.record && D.record.judged ? `
  <h3>毎回16通りを買い続けた場合の累計</h3>
  <div class="money">
    <div class="m"><div class="v">${yen(D.record.total_cost)}</div><div class="k">購入金額の合計（${D.record.judged}回分）</div></div>
    <div class="m ${D.record.total_prize ? 'plus' : ''}"><div class="v">${yen(D.record.total_prize)}</div><div class="k">当選金額の合計（的中${D.record.hits}回）</div></div>
    <div class="m ${D.record.total_profit >= 0 ? 'plus' : 'minus'}"><div class="v">${D.record.total_profit >= 0 ? '+' : ''}${yen(D.record.total_profit)}</div><div class="k">通算の収支</div></div>
    <div class="m"><div class="v">${(D.record.total_prize / Math.max(1, D.record.total_cost) * 100).toFixed(1)}%</div><div class="k">回収率（理論値は約43%）</div></div>
  </div>
  <p class="note">実際に買ったわけではなく、候補16通りを毎回1口ずつ買ったと仮定した計算です。記録が少ないうちは大きく振れます。長く続けるほど理論値の43%に近づきます。</p>` : ''}
  ${renderRounds(D.__rounds || [])}
</section>

`;

  $('#foot').innerHTML = `ロジック版 ${esc(D.logic_version)} ／ 生成 ${esc(D.generated_at)}<br>
    ナンバーズ3の当選番号は予測できません。このサイトは<strong>世の中で言われている手法の検証</strong>と候補の提示を行うもので、当選を保証しません。宝くじの購入は余裕資金の範囲で行ってください。<br>
    当選番号データの取得元: <a class="rlink" href="https://loto-life.net/" rel="noopener">loto-life.net</a> ／
    <a class="rlink" href="https://www.mk-mode.com/" rel="noopener">mk-mode.com</a>`;
}

(async () => {
  try{
    const t = Date.now();
    const q = new URLSearchParams(location.search).get('round');
    if(q && /^(\d+|demo)$/.test(q)){
      const S = await fetch(`data/rounds/${q}.json?t=${t}`).then(r => {
        if(!r.ok) throw new Error(`第${q}回の保存版ページは存在しません`);
        return r.json();
      });
      renderSnapshot(S);
      return;
    }
    const [D, rounds] = await Promise.all([
      fetch(`data/latest.json?t=${t}`).then(r => r.json()),
      fetch(`data/rounds/index.json?t=${t}`).then(r => r.json()).catch(() => []),
    ]);
    D.__rounds = rounds;
    render(D);
  }catch(e){
    $('#app').innerHTML = `<section><p class="err">データの読み込みに失敗しました。<br>
      <span class="note">${esc(e.message)}</span></p></section>`;
  }
})();
</script>
</body>
</html>
