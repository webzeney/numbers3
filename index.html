<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ナンバーズ3 候補数字</title>
<meta name="description" content="ナンバーズ3の候補数字を、検証可能な抽選で選出します。全履歴7080回の検定結果も公開しています。">
<style>
:root{
  --bg:#f6f7f9; --surface:#ffffff; --surface2:#f0f2f5; --line:#e2e5ea;
  --text:#14171c; --text2:#5b6472; --text3:#8b95a4;
  --accent:#2f6df6; --ok:#1a8f5a; --warn:#c8871a; --ng:#d2453d;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1116; --surface:#161b22; --surface2:#1c232c; --line:#2a323d;
    --text:#e7ebf0; --text2:#9aa5b4; --text3:#6e7a8a;
    --accent:#5b8cff; --ok:#3fbd81; --warn:#e0a94a; --ng:#f0645c;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1116; --surface:#161b22; --surface2:#1c232c; --line:#2a323d;
  --text:#e7ebf0; --text2:#9aa5b4; --text3:#6e7a8a;
  --accent:#5b8cff; --ok:#3fbd81; --warn:#e0a94a; --ng:#f0645c;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  line-height:1.75; -webkit-text-size-adjust:100%;
}
.wrap{max-width:860px; margin:0 auto; padding:28px 20px 72px}
header{margin-bottom:28px}
.eyebrow{font-size:11px; letter-spacing:.14em; color:var(--text3); text-transform:uppercase}
h1{font-size:22px; margin:6px 0 4px; letter-spacing:.02em}
.lede{font-size:13px; color:var(--text2); margin:0}
.stamp{margin-top:10px; font:11px/1.7 var(--mono); color:var(--text3);
  display:flex; flex-wrap:wrap; gap:4px 14px}
.stamp b{font-weight:600; color:var(--text2)}
section{
  background:var(--surface); border:1px solid var(--line); border-radius:12px;
  padding:20px; margin-bottom:16px;
}
h2{font-size:14px; margin:0 0 14px; display:flex; align-items:baseline; gap:8px}
h2 .num{font:600 11px/1 var(--mono); color:var(--text3); letter-spacing:.1em}
h3{font-size:13px; margin:22px 0 10px; color:var(--text2)}
p{margin:0 0 12px; font-size:13px; color:var(--text2)}
.note{font-size:12px; color:var(--text3)}

/* 候補数字 */
.picks{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; margin:4px 0 18px}
.pick{
  background:var(--surface2); border:1px solid var(--line);
  border-radius:10px; padding:14px 8px; text-align:center;
}
.pick .d{font:700 40px/1 var(--mono); letter-spacing:-.02em}
.pick .tg{margin-top:10px; display:flex; flex-direction:column; gap:4px}
.pick .tg span{
  font-size:10px; color:var(--text2); background:var(--bg);
  border:1px solid var(--line); border-radius:99px; padding:2px 6px; white-space:nowrap;
}
.round{font:600 12px/1 var(--mono); color:var(--accent)}

/* 確率 */
.odds{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px}
.odd{background:var(--surface2); border:1px solid var(--line); border-radius:9px; padding:12px}
.odd .v{font:700 20px/1.2 var(--mono)}
.odd .k{font-size:11px; color:var(--text3); margin-top:4px}
.odd.miss .v{color:var(--ng)}

/* テーブル */
.scroll{overflow-x:auto; -webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{height:6px}
.scroll::-webkit-scrollbar-thumb{background:var(--line); border-radius:3px}
.hint{display:none}
@media (max-width:560px){ .hint{display:block; font-size:10px; color:var(--text3); margin:0 0 6px} }
table{border-collapse:collapse; width:100%; font-size:12px; min-width:460px}
th,td{padding:8px 10px; text-align:right; border-bottom:1px solid var(--line); white-space:nowrap}
th{font-weight:600; color:var(--text3); font-size:11px; text-align:right}
th:first-child,td:first-child{text-align:left}
tbody tr:last-child td{border-bottom:none}
td.mono,th.mono{font-family:var(--mono)}
.ok{color:var(--ok)} .ng{color:var(--ng)} .dim{color:var(--text3)}

/* 分布バー */
.bars{display:flex; flex-direction:column; gap:5px}
.bar{display:grid; grid-template-columns:18px 1fr 72px; gap:8px; align-items:center; font-size:11px}
.bar .t{height:16px; background:var(--surface2); border-radius:4px; overflow:hidden; position:relative}
.bar .f{height:100%; background:var(--accent); opacity:.75}
.bar .e{position:absolute; top:-2px; bottom:-2px; width:2px; background:var(--text3)}
.bars.dev .t{position:relative}
.bars.dev .f{position:absolute; top:0; bottom:0; border-radius:3px; opacity:.9}
.bars.dev .zero{position:absolute; left:50%; top:-3px; bottom:-3px; width:2px;
  background:var(--text3); opacity:.75; transform:translateX(-1px)}
.bar .n .up{color:var(--accent)} .bar .n .down{color:var(--warn)}
.bar .n{font-family:var(--mono); color:var(--text2); text-align:right}
.bar .l{font-family:var(--mono); color:var(--text2)}

/* 透明性 */
dl.kv{margin:0; display:grid; grid-template-columns:auto minmax(0,1fr); gap:6px 14px; font-size:12px}
dl.kv dt{color:var(--text3); white-space:nowrap}
dl.kv dd{margin:0; font-family:var(--mono); color:var(--text);
  word-break:break-all; overflow-wrap:anywhere; min-width:0}

.stale.awaiting{border-color:var(--accent)}
.stale.awaiting strong{color:var(--accent)}
.stale{background:var(--surface); border:1px solid var(--ng); border-left-width:3px;
  border-radius:0 10px 10px 0; padding:14px 16px; margin-bottom:16px; font-size:13px}
.stale strong{color:var(--ng)}
.stale .when{font:11px/1.6 var(--mono); color:var(--text3); display:block; margin-top:6px}
.back{display:inline-block; font-size:12px; color:var(--accent); text-decoration:none; margin-bottom:14px}
.back:hover{text-decoration:underline}
.result{display:flex; align-items:center; gap:14px; flex-wrap:wrap; background:var(--surface2);
  border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin:4px 0 14px}
.result .big{font:700 34px/1 var(--mono); letter-spacing:.06em}
.result .txt{font-size:13px; color:var(--text2)}
.result.hit{border-color:var(--ok)} .result.miss{border-color:var(--ng)}
.result.hit .big{color:var(--ok)} .result.miss .big{color:var(--ng)}
.pending{font-size:13px; color:var(--text3)}
a.rlink{color:var(--accent); text-decoration:none; font-family:var(--mono)}
a.rlink:hover{text-decoration:underline}
.ai{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:10px}
.ai-card{background:var(--surface2); border:1px solid var(--line); border-radius:10px; padding:14px}
.ai-card .who{font-size:12px; font-weight:600; display:flex; justify-content:space-between; align-items:baseline; gap:6px}
.ai-card .who em{font:400 10px/1 var(--mono); color:var(--text3); font-style:normal}
.ai-card .st{font:700 30px/1.2 var(--mono); letter-spacing:.04em; margin:8px 0 2px}
.ai-card .cd{font:12px/1.5 var(--mono); color:var(--text2)}
.ai-card .rs{font-size:11px; color:var(--text3); margin-top:8px; line-height:1.6}
.ai-card .rec{font-size:11px; color:var(--text2); margin-top:10px; padding-top:8px; border-top:1px solid var(--line)}
.ai-card.off .st{font-size:15px; color:var(--text3); font-weight:400}
.callout{
  border-left:3px solid var(--accent); background:var(--surface2);
  padding:12px 14px; border-radius:0 8px 8px 0; font-size:12px; color:var(--text2);
}
.callout strong{color:var(--text)}
footer{margin-top:28px; font-size:11px; color:var(--text3); text-align:center}
.err{color:var(--ng); font-size:13px}
.load{color:var(--text3); font-size:13px}
@media (max-width:560px){
  .wrap{padding:18px 13px 48px}
  section{padding:16px 13px; border-radius:10px}
  h1{font-size:22px}
  .lede{font-size:14.5px}
  p{font-size:15px; line-height:1.85}
  .note{font-size:13.5px; line-height:1.75}
  h2{font-size:16px}
  h3{font-size:15px}

  /* 候補4数字: 4列を維持したまま数字とタグを大きく */
  .picks{gap:6px}
  .pick{padding:12px 4px; border-radius:8px}
  .pick .d{font-size:32px}
  .pick .tg{gap:4px; margin-top:9px}
  .pick .tg span{
    font-size:10px; padding:3px 2px; border-radius:6px;
    white-space:normal; line-height:1.35; letter-spacing:-.04em;
  }

  /* 確率カード */
  .odds{grid-template-columns:repeat(2,1fr); gap:9px}
  .odd{padding:12px 11px}
  .odd .v{font-size:23px}
  .odd .k{font-size:13px; line-height:1.6; margin-top:6px}

  /* 選出記録: 項目名が上、値が下 */
  dl.kv{grid-template-columns:1fr; gap:0}
  dl.kv dt{margin-top:12px; font-size:13.5px}
  dl.kv dd{font-size:13.5px; line-height:1.65}

  /* 分布バー */
  .bar{grid-template-columns:18px 1fr 92px; gap:8px; font-size:13px}
  .bar .t{height:18px}

  /* 表 */
  table{min-width:460px; font-size:14px}
  th,td{padding:10px}
  th{font-size:13px}
  .hint{font-size:12.5px}

  /* AI・結果表示 */
  .ai{gap:9px}
  .ai-card{padding:14px}
  .ai-card .who{font-size:14.5px}
  .ai-card .st{font-size:31px}
  .ai-card .cd{font-size:14px}
  .ai-card .rs{font-size:13.5px}
  .ai-card .rec{font-size:13.5px}
  .result{gap:12px; padding:14px}
  .result .big{font-size:32px}
  .result .txt{font-size:14.5px}
  .callout{font-size:14px; padding:14px; line-height:1.85}
  .stamp{font-size:12.5px; gap:4px 12px}
  footer{font-size:13px; line-height:1.75}
}

/* 特に狭い端末ではタグだけ詰める */
@media (max-width:360px){
  .pick .d{font-size:29px}
  .pick .tg span{font-size:9.5px; padding:2px 1px}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="eyebrow">Numbers3 Selection System</div>
  <h1>ナンバーズ3 候補数字</h1>
  <p class="lede">候補は検証可能な抽選で選びます。当たりやすさは主張しません。</p>
  <div class="stamp" id="stamp"></div>
</header>
<main id="app"><p class="load">読み込み中…</p></main>
<footer id="foot"></footer>
</div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct = (v) => v.toFixed(1) + '%';
const jdate = (iso) => {
  if(!iso || iso.length < 16) return iso || '—';
  return `${iso.slice(0,4)}/${iso.slice(5,7)}/${iso.slice(8,10)} ${iso.slice(11,16)}`;
};
function stampLine(parts){ $('#stamp').innerHTML = parts.filter(Boolean).join(''); }

function verdictClass(v){ return v === '有意差なし' ? 'dim' : 'ng'; }

function renderPicks(D){
  return D.candidates.map(d => {
    const tags = (D.tags[d] || []).map(t =>
      `<span title="${esc(t.desc)}${t.hit_rate ? ` / 実測的中率${t.hit_rate}%（基準27.1%）` : ''}">${esc(t.name)}</span>`
    ).join('');
    return `<div class="pick"><div class="d">${esc(d)}</div><div class="tg">${tags}</div></div>`;
  }).join('');
}

function outcomeBox(outcome, result, demo){
  if(!result) return '<p class="pending">この回はまだ抽選前です。</p>';
  const cls = outcome && outcome.covered ? 'hit' : 'miss';
  const sim = result.SIMULATED
    ? `<div class="callout" style="margin-bottom:10px;border-left-color:var(--warn)"><strong>これは表示例です。</strong>実際の抽選結果ではありません。${demo ? 'ハズレたときの見え方を確認するための架空のデータです。' : '本物の結果が確定すると自動的に置き換わります。'}</div>`
    : '';
  return sim + `<div class="result ${cls}">
    <div class="big">${esc(result.number)}</div>
    <div class="txt"><strong>${outcome && outcome.covered ? `${outcome.covered}桁が一致` : 'ハズレ'}</strong><br>
      ${esc((outcome && outcome.label) || '')}
      ${outcome && outcome.detail ? `<br><span class="note">当選番号の形: ${esc(outcome.detail.pattern)} ／ 3桁の和: ${outcome.detail.sum}</span>` : ''}
    </div></div>`;
}

function renderRounds(list){
  if(!list.length) return '<p class="note">保存版ページはまだありません。</p>';
  return `<p class="hint">← 横にスクロールできます</p><div class="scroll"><table>
    <thead><tr><th>回</th><th>候補</th><th>当選</th><th>一致</th><th>検証</th></tr></thead>
    <tbody>${list.slice(0,60).map(r => `<tr>
      <td><a class="rlink" href="?round=${r.round}">第${r.round}回</a></td>
      <td class="mono">${r.candidates.join(',')}</td>
      <td class="mono">${r.result ? esc(r.result) : '<span class="dim">抽選前</span>'}</td>
      <td class="mono ${r.covered ? 'ok' : 'dim'}">${r.result ? r.covered + '桁' : '—'}</td>
      <td style="text-align:left;white-space:normal" class="${r.covered ? 'ok' : 'dim'}">${esc(r.label)}</td>
    </tr>`).join('')}</tbody></table></div>`;
}

function renderSnapshot(S){
  const sel = S.selection, o = S.odds;
  const title = S.demo ? '表示例（架空の回・実際の予想ではありません）' : `第${S.target_round}回の予想`;
  document.title = (S.demo ? '表示例' : `第${S.target_round}回の予想`) + ' — ナンバーズ3 候補数字';
  stampLine([
    S.demo ? '<span><b>見本ページ</b></span>'
           : `<span><b>この回の生成</b> ${esc(jdate(S.generated_at))}</span>`,
    S.result ? `<span><b>結果確定</b> ${esc(S.result.date)}</span>` : '<span>抽選前</span>',
  ]);

  $('#app').innerHTML = `
<a class="back" href="./">← 最新の予想に戻る</a>
<section>
  <h2><span class="num">${S.demo ? '見本' : '保存版'}</span>${esc(title)}</h2>
  <p>${S.demo ? 'ハズレたときの表示を確認するための見本ページです。候補も結果も架空です。'
    : `${esc(S.generated_at)} に生成。第${S.basis.round}回（${esc(S.basis.date)}・当選番号 ${esc(S.basis.number)}）の確定を受けて選出しました。`}</p>
  <div class="picks">${renderPicks(S)}</div>
  <h3>結果</h3>
  ${outcomeBox(S.outcome, S.result, S.demo)}
  <p class="note">この予想が1桁も当たらない確率は ${pct(o.miss_all)} でした。候補の選び方によらず決まる値です。</p>
</section>

<section>
  <h2><span class="num">02</span>3つのAIの予想</h2>
  ${renderAI(S)}
  ${S.result ? `<p class="note" style="margin-top:12px">当選番号 ${esc(S.result.number)} との照合結果は各カードに表示しています。</p>` : ''}
</section>

<section>
  <h2><span class="num">03</span>この回の選出記録</h2>
  <dl class="kv">
    <dt>方式</dt><dd>${esc(sel.method)}</dd>
    <dt>種の材料</dt><dd>${esc(sel.seed_material)}</dd>
    <dt>SHA-256</dt><dd>${esc(sel.hash)}</dd>
    <dt>傾きの重み</dt><dd>${sel.tilt_weight}</dd>
    <dt>選出確率</dt><dd>${(sel.probability * 100).toFixed(4)}% (一様の${sel.ratio_to_uniform}倍)</dd>
    <dt>ロジック版</dt><dd>${esc(S.logic_version)}</dd>
  </dl>
  <p class="note" style="margin-top:12px">同じ種から誰でもこの候補を再計算でき、後から書き換えられないことを確認できます。</p>
</section>`;
  $('#foot').innerHTML = `第${S.target_round}回の保存版 ／ ロジック版 ${esc(S.logic_version)}<br>
    ナンバーズ3の当選番号は予測できません。このサイトは候補の提示と統計の可視化のみを行い、当選を保証しません。`;
}

function renderAI(D){
  const ai = D.ai && D.ai.picks;
  if(!ai) return '<p class="note">AI予想は未取得です。</p>';
  const order = ['gpt','claude','gemini'];
  const rec = D.ai_records || {};
  return '<div class="ai">' + order.map(k => {
    const p = ai[k]; if(!p) return '';
    if(p.status !== 'ok'){
      return `<div class="ai-card off"><div class="who">${esc(p.label)}</div>
        <div class="st">${esc(p.status)}</div>
        <div class="rs">${esc(p.detail || '')}</div></div>`;
    }
    const r = rec[k] || {};
    const oc = p.outcome;
    const recLine = oc
      ? `この回: ${oc.straight_hit ? '本命的中' : `候補${oc.covered}桁が一致`}`
      : (r.n ? `通算 ${r.n}回: 本命的中 ${r.straight}回 ／ 平均カバー ${r.mean_covered}桁（基準1.2）` : '記録はこれから');
    return `<div class="ai-card">
      <div class="who">${esc(p.label)}<em>${esc(p.model || '')}</em></div>
      <div class="st">${esc(p.straight || '—')}</div>
      <div class="cd">候補 ${(p.candidates || []).join(',') || '—'}</div>
      <div class="rs">${esc(p.reason || '')}</div>
      <div class="rec">${esc(recLine)}</div>
    </div>`;
  }).join('') + '</div>';
}

function renderAIRecords(D){
  const rec = D.ai_records || {};
  const rows = Object.values(rec).filter(r => r.n > 0);
  if(!rows.length) return '';
  return `<h3>AIごとの通算成績</h3><p class="hint">← 横にスクロールできます</p><div class="scroll"><table>
    <thead><tr><th>AI</th><th>回数</th><th>本命的中</th><th>平均カバー</th><th>1桁以上</th><th>3桁すべて</th></tr></thead>
    <tbody>${rows.map(r => `<tr>
      <td>${esc(r.label)}</td>
      <td class="mono">${r.n}</td>
      <td class="mono ${r.straight ? 'ok' : 'dim'}">${r.straight}回</td>
      <td class="mono">${r.mean_covered}<span class="dim"> / 1.2</span></td>
      <td class="mono">${r.atleast1_rate}%<span class="dim"> / 78.4%</span></td>
      <td class="mono">${r.all3_rate}%<span class="dim"> / 6.4%</span></td>
    </tr>`).join('')}</tbody></table></div>`;
}

function renderTagPoints(pts, chosen){
  if(!pts) return '';
  return '<div class="bars">' + Object.keys(pts).map(d => {
    const p = pts[d], w = (p / 4 * 100).toFixed(0);
    const on = chosen.includes(d);
    return `<div class="bar" style="grid-template-columns:18px 1fr 84px">
      <div class="l" style="${on ? 'color:var(--accent);font-weight:700' : ''}">${d}</div>
      <div class="t"><div class="f" style="width:${w}%;${on ? '' : 'opacity:.35'}"></div></div>
      <div class="n">${p}点${on ? ' <span style="color:var(--accent)">選出</span>' : ''}</div>
    </div>`;
  }).join('') + '</div>';
}

function renderDist(counts, expected){
  const keys = Object.keys(counts);
  const maxAbs = Math.max(...keys.map(d => Math.abs(counts[d] - expected)), 1);
  return `<div class="bars dev">` + keys.map(d => {
    const c = counts[d], diff = c - expected;
    const pct = Math.abs(diff) / maxAbs * 50;
    const style = diff >= 0
      ? `left:50%; width:${pct}%; background:var(--accent)`
      : `left:${50 - pct}%; width:${pct}%; background:var(--warn)`;
    return `<div class="bar">
      <div class="l">${d}</div>
      <div class="t"><div class="zero"></div><div class="f" style="${style}"></div></div>
      <div class="n">${c.toLocaleString()} <span class="${diff >= 0 ? 'up' : 'down'}">${diff >= 0 ? '+' : ''}${Math.round(diff)}</span></div>
    </div>`;
  }).join('') + `</div>
  <p class="note">中央の線が期待値 ${Math.round(expected).toLocaleString()}回。右に伸びるほど多く出ていて、左に伸びるほど出ていない数字です。最大でも${Math.round(maxAbs)}回の差しかなく、統計的には誤差の範囲です。</p>`;
}

function renderRules(rules){
  return `<p class="hint">← 横にスクロールできます</p><div class="scroll"><table>
    <thead><tr><th>原典の鉄則</th><th>実測</th><th>基準</th><th class="mono">z値</th><th>判定</th><th>検定数</th></tr></thead>
    <tbody>${rules.map(r => `<tr>
      <td>${esc(r.name)}</td>
      <td class="mono">${r.rate}%</td>
      <td class="mono dim">${r.base}%</td>
      <td class="mono">${r.z > 0 ? '+' : ''}${r.z}</td>
      <td class="${verdictClass(r.verdict)}">${esc(r.verdict)}</td>
      <td class="mono dim">${r.n.toLocaleString()}</td>
    </tr>`).join('')}</tbody></table></div>`;
}

function render(D){
  const s = D.stats, sel = D.selection, o = D.odds;
  const st = D.stale;
  const awaiting = st && st.kind === 'awaiting';
  const stale = st ? `<div class="stale ${awaiting ? 'awaiting' : ''}">
    <strong>${awaiting ? '第' + D.target_round + '回は抽選済みです。結果の反映を待っています。'
                       : 'この候補は最新ではありません。'}</strong><br>
    ${awaiting
      ? '結果が反映され次第、次の回の候補を自動で生成します。下の候補は第' + D.target_round + '回向けに出したものです。'
      : '結果の取り込みが想定より遅れています。復旧するまで候補は更新されません。'}
    <span class="when">${esc(st.reason)}<br>最終確認: ${esc(st.checked_at)}</span>
  </div>` : '';

  stampLine([
    `<span><b>更新</b> ${esc(jdate(D.generated_at))}</span>`,
    `<span><b>対象</b> 第${D.target_round}回</span>`,
    `<span><b>取り込み済み</b> 第${D.basis.round}回（${esc(D.basis.date)}）</span>`,
    st ? `<span><b>最終確認</b> ${esc(jdate(st.checked_at))}</span>` : '',
  ]);

  $('#app').innerHTML = stale + `
<section>
  <h2><span class="num">01</span>第${D.target_round}回の候補</h2>
  <p>第${D.basis.round}回（${esc(D.basis.date)}・当選番号 ${esc(D.basis.number)}）の確定を受けて選出しました。</p>
  <div class="picks">${renderPicks(D)}</div>
  <div class="odds">
    <div class="odd"><div class="v">${pct(o.atleast1)}</div><div class="k">1桁以上が当選番号に含まれる確率</div></div>
    <div class="odd miss"><div class="v">${pct(o.miss_all)}</div><div class="k">1つも含まれない確率</div></div>
    <div class="odd"><div class="v">${pct(o.box)}</div><div class="k">3桁すべてが候補に含まれる確率</div></div>
    <div class="odd"><div class="v">${o.expected_covered.toFixed(1)}桁</div><div class="k">含まれる桁数の期待値</div></div>
  </div>
  <p class="note" style="margin-top:12px">これらは4数字を選んだ時点で決まる数学的な確率で、候補の選び方によって変わりません。どんな選出方法でも同じ値になります。</p>
</section>

<section>
  <h2><span class="num">02</span>3つのAIの予想</h2>
  <p>ChatGPT・Claude・Geminiに、同じ直近10回の当選番号だけを渡して予想させています。1回号につき1回だけ問い合わせ、結果は記録に残します。</p>
  ${renderAI(D)}
  <div class="callout" style="margin-top:14px">
    <strong>この3つも当たりません。</strong>本命3桁が当たる確率はどの予想でも1/1000＝0.1%、候補4数字に当選の1桁以上が含まれる確率は78.4%です。AIが選んでも、上のランダム選出と数学的にまったく同じ確率です。当たらないという事実を記録し続けるための欄です。
  </div>
  ${renderAIRecords(D)}
</section>

<section>
  <h2><span class="num">03</span>どう選んでいるか</h2>
  <p>0〜9から4つを選ぶ組み合わせは <strong>210通り</strong>（10C4）です。この210通りから抽選で1組を選びます。</p>
  <p>完全な等確率ではなく、<strong>宝島本の手法（ひっぱり・スライド・裏数字・合わせ数字）に該当する数字を多く含む組を、わずかに選ばれやすく</strong>しています。今回の範囲は ${sel.spread.min}〜${sel.spread.max}倍で、選ばれた組は一様の場合の <strong>${sel.ratio_to_uniform}倍</strong>（確率 ${(sel.probability * 100).toFixed(3)}%、一様なら${(sel.probability_uniform * 100).toFixed(3)}%）でした。</p>
  <div class="callout">
    この傾きは<strong>前回の当選番号との関係</strong>で決まるため、特定の数字が固定的に有利になることはありません。全履歴3000回で検証したところ、傾きを入れても数字ごとの採用率の偏り（χ²=4.8）は一様ランダム（χ²=4.0）とほぼ変わらず、いずれも5%限界16.92を大きく下回りました。<br><br>
    乱数の種は「<strong>回号 + 直近の当選番号</strong>」のSHA-256です。前回の結果が確定するまで次回の候補は計算できず、確定後は誰でも同じ値を再現できます。日時や実行環境には依存しません。
  </div>
  <h3>今回の原典ポイント（前回 ${esc(D.basis.number)} から見た各数字）</h3>
  ${renderTagPoints(sel.tag_points, D.candidates)}
  <h3>この回の選出記録</h3>
  <dl class="kv">
    <dt>方式</dt><dd>${esc(sel.method)}</dd>
    <dt>種の材料</dt><dd>${esc(sel.seed_material)}</dd>
    <dt>SHA-256</dt><dd>${esc(sel.hash)}</dd>
    <dt>傾きの重み</dt><dd>${sel.tilt_weight}</dd>
    <dt>選出確率</dt><dd>${(sel.probability * 100).toFixed(4)}% (一様の${sel.ratio_to_uniform}倍)</dd>
    <dt>ロジック版</dt><dd>${esc(D.logic_version)}</dd>
    <dt>生成時刻</dt><dd>${esc(D.generated_at)}</dd>
  </dl>
</section>

<section>
  <h2><span class="num">04</span>攻略本の鉄則を全履歴で検定した結果</h2>
  <p>${s.draws.toLocaleString()}回（${esc(s.span[0])}〜${esc(s.span[1])}）で検定しました。基準の27.1%は「どの数字も3桁のどこかに出る確率」（1−0.9³）です。</p>
  ${renderRules(s.rules)}
  <p class="note" style="margin-top:12px">z値が±1.96以内なら偏りは偶然の範囲です。<strong>4つの鉄則すべてが基準値と区別できません</strong>。だからこの候補選出では、これらを点数に使わず、選ばれた後の「読み物」としてタグ表示するだけにしています。</p>
</section>

<section>
  <h2><span class="num">05</span>抽選の偏りの監視</h2>
  <p>抽選機に偏りが出ていないかを毎回検定しています。χ²が5%限界の${s.chi2_limit_5}を超えたら偏りの疑いが出ます。</p>
  <div class="odds">
    <div class="odd"><div class="v ${s.chi2_all < s.chi2_limit_5 ? 'ok' : 'ng'}">${s.chi2_all}</div><div class="k">全体のχ²（限界${s.chi2_limit_5}）</div></div>
    ${s.chi2_pos.map((c, i) => `<div class="odd"><div class="v ${c < s.chi2_limit_5 ? 'ok' : 'ng'}">${c}</div><div class="k">${['百','十','一'][i]}の位のχ²</div></div>`).join('')}
  </div>
  <h3>数字の出現回数（期待値からのズレ）</h3>
  <div class="bars">${renderDist(s.digit_counts, s.digit_expected)}</div>
  <h3>湿度の影響</h3>
  <p>高湿度期（6〜9月・${s.season.humid_draws.toLocaleString()}回）と低湿度期（12〜3月・${s.season.dry_draws.toLocaleString()}回）で出現分布を比較しました。同質性のχ²は <strong>${s.season.homogeneity_chi2}</strong> で、5%限界${s.chi2_limit_5}を下回ります。<strong>季節による差は検出されません</strong>。</p>
  <p class="note">ダブル出現率 ${s.double_rate}%（理論27%） / トリプル ${s.triple_rate}%（理論1%） / 3桁の和の平均 ${s.sum_mean}（理論13.5）</p>
</section>

<section>
  <h2><span class="num">06</span>保存版ページ</h2>
  <p>各回の予想ページをそのまま保存しています。候補・乱数の種・AIの予想・結果の検証が、当時の形で残ります。</p>
  ${D.record && D.record.start_round ? `<p class="note">記録は<strong>第${D.record.start_round}回から</strong>。現在 ${D.record.count}回分を保存し、うち${D.record.judged}回が結果確定済みです。</p>` : ''}
  ${renderRounds(D.__rounds || [])}
</section>

`;

  $('#foot').innerHTML = `ロジック版 ${esc(D.logic_version)} ／ 生成 ${esc(D.generated_at)}<br>
    ナンバーズ3の当選番号は予測できません。このサイトは候補の提示と統計の可視化のみを行い、当選を保証しません。<br>
    当選番号データの取得元: <a class="rlink" href="https://loto-life.net/" rel="noopener">loto-life.net</a> ／
    <a class="rlink" href="https://www.mk-mode.com/" rel="noopener">mk-mode.com</a>`;
}

(async () => {
  try{
    const t = Date.now();
    const q = new URLSearchParams(location.search).get('round');
    if(q && /^(\d+|demo)$/.test(q)){
      const S = await fetch(`data/rounds/${q}.json?t=${t}`).then(r => {
        if(!r.ok) throw new Error(`第${q}回の保存版ページは存在しません`);
        return r.json();
      });
      renderSnapshot(S);
      return;
    }
    const [D, rounds] = await Promise.all([
      fetch(`data/latest.json?t=${t}`).then(r => r.json()),
      fetch(`data/rounds/index.json?t=${t}`).then(r => r.json()).catch(() => []),
    ]);
    D.__rounds = rounds;
    render(D);
  }catch(e){
    $('#app').innerHTML = `<section><p class="err">データの読み込みに失敗しました。<br>
      <span class="note">${esc(e.message)}</span></p></section>`;
  }
})();
</script>
</body>
</html>
