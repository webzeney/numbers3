name: ナンバーズ3 自動更新

on:
  schedule:
    - cron: '0 15 * * *'      # UTC 15:00 = JST 0:00（本命）
    - cron: '0 1-3 * * *'     # UTC 01-03 = JST 10:00-12:00（保険）
  workflow_dispatch:

concurrency:
  group: numbers3-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 追加ライブラリは不要（標準ライブラリのみで動く）

      - name: 候補を生成
        id: gen
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TZ: Asia/Tokyo
        run: |
          set +e
          python3 generate.py --if-new
          CODE=$?
          set -e
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          case $CODE in
            0) echo "::notice::候補を生成した" ;;
            2) echo "::warning::データ未更新または異常のため生成を見送った" ;;
            3) echo "::notice::すでに生成済み" ;;
            *) echo "::error::想定外の終了コード $CODE"; exit $CODE ;;
          esac

      - name: 結果をGitHubに保存
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git diff --quiet && git diff --staged --quiet && { echo "変更なし"; exit 0; }
          git commit -m "自動更新: 第$(python3 -c "import json;print(json.load(open('data/latest.json'))['target_round'])")回向け"
          git push

      # 生成が走らない日(結果待ち・生成済み)もサーバーとリポジトリを一致させる
      - name: ロリポップにFTPアップロード
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./
          server-dir: /numbers/
          exclude: |
            **/.git*
            **/.git*/**
            **/tools/**
            **/__pycache__/**
            **/data/sources/**
            **/.env
